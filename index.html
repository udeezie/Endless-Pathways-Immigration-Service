<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Endless Pathways Immigration Services - RCIC Appiah Bonsu provides expert Canadian immigration consulting. Study permits, work permits, permanent residence."
    />
    <!-- Link previews. There were no og tags at all, so shares to LinkedIn,
         WhatsApp and Facebook rendered as a bare URL. This is a single-page
         app with no prerendering, so crawlers only ever see this document —
         the card is therefore the site's card, not a per-article one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Endless Pathways Immigration Services" />
    <meta
      property="og:title"
      content="Endless Pathways Immigration Services | RCIC Appiah Bonsu"
    />
    <meta
      property="og:description"
      content="Regulated Canadian immigration consulting with RCIC Appiah Bonsu. Study permits, work permits, permanent residence, citizenship and appeals."
    />
    <meta property="og:url" content="https://www.endlesspathways.ca/" />
    <meta property="og:image" content="https://www.endlesspathways.ca/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Endless Pathways Immigration Services, Regulated Canadian Immigration Consultant"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#f7f4ec" />
    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=swap"
      rel="stylesheet"
    />

    <title>Endless Pathways Immigration Services | RCIC Appiah Bonsu</title>

    <script>
      // Ground the page in the right theme before the bundle paints, so a
      // dark-mode visitor never sees a white flash. Only <html> is coloured
      // here — the body's own colours stay owned by the design tokens, or this
      // rule would outrank them and strand the page on one theme after a
      // toggle. Light is the default; dark is opt-in.
      (function () {
        try {
          var dark = localStorage.getItem("theme") === "dark";
          document.documentElement.style.backgroundColor = dark
            ? "#000000"
            : "#f7f4ec";
          if (dark) {
            document.addEventListener("DOMContentLoaded", function () {
              document.body.classList.add("dark-mode");
            });
          }
        } catch (e) {
          /* private mode — the default dark shell below still applies */
        }
      })();
    </script>

    <style>
      /* Critical shell only. Everything else ships in the bundle. */
      html {
        background-color: #f7f4ec;
      }
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
